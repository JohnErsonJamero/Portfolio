<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Save Grades</title>
    <a href="portfolio.html">Home</a>
</head>
<body>
    <center>
    <h1>Save Grades</h1>

    <label>LRN <input type="text" id="txtLRN" maxlength="11"></label>
    <label>Name <input type="text" id="txtName"></label>
    <label>Section <input type="text" id="txtSection"></label>
    <label>Subject <input type="text" id="txtSubject"></label>
    <label>Grade <input type="text" id="txtGrade"></label>
    <button id="btnSave">Save</button>
    </center>

    <center>
    <div id="message"></div>
    <br>
      <center>  
    <table border="1">
        <thead>
            <tr>
                <th>LRN</th>
                <th>Name</th>
                <th>Section</th>
                <th>Subject</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
    </center>

    <script>
        var txtLRN = document.getElementById("txtLRN");
        var txtName = document.getElementById("txtName");
        var txtSection = document.getElementById("txtSection");
        var txtSubject = document.getElementById("txtSubject");
        var txtGrade = document.getElementById("txtGrade");
        var btnSave = document.getElementById("btnSave");
        var tableBody = document.getElementById("tableBody");
        var message = document.getElementById("message");

        var grades = JSON.parse(localStorage.getItem("grades")) || [];

        function showGrades() {
            tableBody.textContent = ""; 
            for (var i = 0; i < grades.length; i++) {
                var row = tableBody.insertRow(); 
                row.insertCell().textContent = grades[i].lrn;
                row.insertCell().textContent = grades[i].name;
                row.insertCell().textContent = grades[i].section;
                row.insertCell().textContent = grades[i].subject;
                row.insertCell().textContent = grades[i].grade;
            }
        }

        function saveGrade() {
            var lrn = txtLRN.value.trim();
            var name = txtName.value.trim();
            var section = txtSection.value.trim();
            var subject = txtSubject.value.trim();
            var grade = txtGrade.value.trim();

            if (lrn === "" || name === "" || section === "" || subject === "" || grade === "") {
                message.textContent = "Please fill in all the boxes!";
                return;
            }

            if (lrn.length > 11) {
                message.textContent = "LRN must not exceed 11 characters.";
                return;
            }

            var record = { lrn: lrn, name: name, section: section, subject: subject, grade: grade };

            grades.push(record); 
            localStorage.setItem("grades", JSON.stringify(grades)); 

            message.textContent = "Saved.";

            txtLRN.value = "";
            txtName.value = "";
            txtSection.value = "";
            txtSubject.value = "";
            txtGrade.value = "";
            showGrades();
        }

        btnSave.addEventListener("click", saveGrade);

        showGrades();
    </script>
</body>
</html>
