<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <center>
  <a href = JohnErson.html"> Personal Web page </a>
  </center>
  <style>
    :root {
      /* Color palette */
      --primary: #2563eb;       /* Main interactive element color */
      --accent: #f97316;        /* Primary action button color */
      --accent-hover: #ea580c;  /* Button color on hover state */
      --bg-main: #f8fafc;       /* Page background fallback */
      --surface: #ffffff;       /* Card/Container background */
      --text-main: #0f172a;     /* Primary body text color */
      --text-muted: #64748b;    /* Muted text color for labels */
      --border: #e2e8f0;        /* Subtle border color */
      --focus-ring: rgba(37, 99, 235, 0.2); /* Semi-transparent blue glow */
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 400px;
      margin: 60px auto;
      padding: 28px;
      background-color: var(--surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    #container {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 8px;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-group {
      display: block;
    }

    /* Shared properties for input controls and buttons */
    input[type="number"],
    input[type="button"],
    input[type="reset"] {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    /* Number Input Fields */
    input[type="number"] {
      border: 1.5px solid var(--border);
      color: var(--text-main);
      background-color: #fff;
      outline: none;
      margin-bottom: 12px;
    }

    /* Focus state for Number Input */
    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    /* Submit/Action Button Base Style */
    input[type="button"] {
      background-color: var(--accent);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(249, 115, 22, 0.2);
      margin-bottom: 10px;
    }

    /* Hover state for Compute Button */
    input[type="button"]:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 4px 8px rgba(249, 115, 22, 0.3);
    }

    /* Active click state for Compute Button */
    input[type="button"]:active {
      transform: translateY(1px);
    }

    /* Reset Button Style */
    input[type="reset"] {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      font-weight: 600;
      cursor: pointer;
    }

    input[type="reset"]:hover {
      background-color: var(--bg-main);
      color: var(--text-main);
    }

    output {
      display: block;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <form id="discountForm">
    <div id="container">
      <h3>Discount Calculator</h3>

      <label for="price">Price before discount</label>
      <input type="number" id="price" step="0.01" min="0">

      <label for="discount">Discount (%)</label>
      <input type="number" id="discount" step="0.01" min="0" max="100">

      <label for="price-after">Price after discount</label>
      <output id="priceAfter">&#8369; 0.00</output>

      <label for="saved-amount">Saved amount</label>
      <output id="savedAmount">&#8369; 0.00</output>

      <input type="button" id="btnCompute" value="Compute">
      <input type="reset" id="btnReset" value="Reset">

      <label>Programmed by: John Erson E. Jamero, 2026 and 12 - Cooper</label>
    </div>
  </form>

  <script>
    // Access DOM Elements
    const thePrice = document.getElementById("price");
    const theDiscount = document.getElementById("discount");
    const theButton = document.getElementById("btnCompute");
    const priceAfterOut = document.getElementById("priceAfter");
    const savedAmountOut = document.getElementById("savedAmount");
    const btnReset = document.getElementById("btnReset");

    // Calculation Function
    function computeDiscount() {
      const price = parseFloat(thePrice.value) || 0;
      const discountPercent = parseFloat(theDiscount.value) || 0;

      const saved = price * (discountPercent / 100);
      const finalPrice = price - saved;

      // Update output elements formatted with Peso sign
      savedAmountOut.innerHTML = "&#8369;" + saved.toFixed(4);
      priceAfterOut.innerHTML = "&#8369;" + finalPrice.toFixed(4);
    }

    // Event Listeners
    theButton.addEventListener('click', computeDiscount);

    // Reset handler to clear output fields back to default
    btnReset.addEventListener('click', function() {
      priceAfterOut.innerHTML = "&#8369; 0.00";
      savedAmountOut.innerHTML = "&#8369; 0.00";
    });
  </script>

</body>
</html>
