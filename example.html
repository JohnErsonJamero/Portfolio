    <a href = example.html">  <i>>console example</i>
    <script>
        console.log("Hello");
        var firsNum =  100;
        var secondNum = 30;
        var sum = firsNum + secondNum;
        var sub = firsNum - secondNum;
        var mul = firsNum * secondNum;
        var div = firsNum / secondNum;
        var mod = firsNum % secondNum;
        
        console.log("firstNum " + " + " + " secondNum "  + " = " + sum);
        console.log("firstNum " + " - " + " secondNum "  + " = " + sub);
        console.log("firstNum " + " * " + " secondNum "  + " = " + mul);
        console.log("firstNum " + " / " + " secondNum "  + " = " + div);
        console.log("firstNum " + " % " + " secondNum "  + " = " + mod);

        console.log(sum);
        console.log(sub);
        console.log(mul);
        console.log(div);
        console.log(mod);

    </script>
